spring.config.import=optional:file:.env[.properties]
spring.application.name=backend
# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Schema lives in schema.sql (runs at startup, idempotent); set ddl-auto=validate to have Hibernate verify it matches the entities.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

jwt.secret=${JWT_SECRET}
jwt.expires-in=${JWT_EXPIRES_IN}
jwt.refresh-secret=${JWT_REFRESH_SECRET}
jwt.refresh-expires-in=${JWT_REFRESH_EXPIRES_IN}

app.frontend-url=${FRONTEND_URL}


spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${SMTP_FROM}

app.item-expiry.days=90
app.item-expiry.cron=0 0 3 * * *
app.item-expiry.batch-size=200

