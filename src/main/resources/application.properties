spring.config.import=optional:file:.env[.properties]
spring.application.name=backend
# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

jwt.secret=${JWT_SECRET}
jwt.expires-in=${JWT_EXPIRES_IN}
jwt.refresh-secret=${JWT_REFRESH_SECRET}
jwt.refresh-expires-in=${JWT_REFRESH_EXPIRES_IN}

app.frontend-url=${FRONTEND_URL}


spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${SMTP_FROM}

app.item-expiry.days=90
app.item-expiry.cron=0 0 3 * * *
app.item-expiry.batch-size=200

spring.jpa.properties.hibernate.default_batch_fetch_size=50

# within the env change the APP_SEED_ENABLED into true to make the seeder work
app.seed.enabled=${APP_SEED_ENABLED}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.moderator-password=${SEED_MODERATOR_PASSWORD:}
app.seed.student-password=${SEED_STUDENT_PASSWORD:}

# ---------------------------------------------------------------
# Account security
# ---------------------------------------------------------------
# Failed logins before the account is locked, and for how many minutes.
app.auth.max-failed-logins=5
app.auth.lock-minutes=15
# Nightly cleanup of expired refresh / email tokens.
app.auth.cleanup-cron=0 30 3 * * *

# Behind nginx / a load balancer set this to "native" so rate limits see the real client IP.
# Leave it "none" when clients connect directly (otherwise the header could be faked).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}